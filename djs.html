<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文文与佳佳已相识</title>
  <link rel="stylesheet" href="daojishi/css/normalize.min.css">
  <link rel="stylesheet" href="daojishi/css/css.css">
  <style>
    /* ============ 基础 ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #241026; /* WebGL 加载前的兜底深色背景 */
      font-family: "Raleway", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ 樱花背景画布（铺满全屏，由 script.js 控制尺寸） ============ */
    canvas#sakura {
      position: fixed;
      top: 0;
      left: 0;
      display: block;
      z-index: 0;
    }

    /* ============ 透明玻璃卡片（公交 + 倒计时） ============ */
    .page {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: none; /* 不挡背景，只让卡片可交互 */
    }

    .glass-card {
      pointer-events: auto;
      width: min(92vw, 860px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px); /* 手机浏览器地址栏收起后的实际高度 */
      overflow-y: auto;
      padding: clamp(20px, 4vw, 40px);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
      color: #ffffff;
    }

    /* 不支持 backdrop-filter 的老浏览器：提高背景不透明度兜底 */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass-card { background: rgba(40, 20, 46, 0.82); }
    }

    /* ============ 倒计时配色（沿用原组件） ============ */
    :root {
      --palette-1: #FFCDB2;
      --palette-2: #FFB4A2;
      --palette-3: #E5989B;
      --palette-4: #B5838D;
      --palette-5: #6D6875;
    }

    /* ============ 公交车（纯 CSS） ============ */
    .bus {
      transform: scale(0.8);
      position: relative;
      width: 120px;
      height: 100px;
      margin: 0.5rem auto 3rem;
      border-radius: 30px 30px 0 0;
      background: var(--palette-5);
    }
    .bus::before, .bus::after {
      content: '';
      position: absolute;
      top: 100%;
      width: 20px;
      height: 20px;
      border-radius: 0 0 2px 2px;
      background: var(--palette-5);
    }
    .bus::before { left: 0.5rem; }
    .bus::after { right: 0.5rem; }
    .bus .windows {
      position: absolute;
      top: 20px;
      left: 0.5rem;
      right: 0.5rem;
      height: 35px;
    }
    .bus .windows::before, .bus .windows::after {
      content: '';
      position: absolute;
      top: 0;
      width: 48%;
      height: 100%;
      background: rgba(255, 255, 255, 0.7);
    }
    .bus .windows::before { left: 0; }
    .bus .windows::after { right: 0; }
    .bus .lights {
      position: absolute;
      bottom: 10px;
      left: 0.5rem;
      right: 0.5rem;
      height: 10px;
    }
    .bus .lights::before, .bus .lights::after {
      content: '';
      position: absolute;
      top: 0;
      width: 10px;
      height: 10px;
      background: var(--palette-2);
      border-radius: 50%;
    }
    .bus .lights::before {
      left: 16px;
      box-shadow: -16px 0 0 2px rgba(255, 255, 255, 0.5),
                  14px 0 0 var(--palette-3);
      animation: lighting 6s 2s linear infinite;
    }
    .bus .lights::after {
      right: 16px;
      box-shadow: 16px 0 0 2px rgba(255, 255, 255, 0.5),
                  -14px 0 0 var(--palette-3);
      animation: lighting2 6s 2s linear infinite;
    }
    .bus .street {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 1px;
      background: rgba(181, 131, 141, 0.8);
    }
    .bus .street::before, .bus .street::after {
      content: '';
      position: absolute;
      height: 1px;
      left: 50%;
      transform: translateX(-50%);
    }
    .bus .street::before {
      top: 10px;
      width: 110px;
      background: rgba(181, 131, 141, 0.6);
    }
    .bus .street::after {
      top: 20px;
      width: 90px;
      background: rgba(181, 131, 141, 0.4);
    }

    /* ============ 计时器 ============ */
    .countdown { text-align: center; }
    .timer {
      display: flex;
      flex-wrap: nowrap; /* 永远不换行：四个格子始终一排 */
      justify-content: center;
      gap: clamp(6px, 1.5vw, 18px);
      perspective: 1000px;
    }
    .timer .box {
      flex: 1 1 0;      /* 弹性均分宽度，随屏幕收缩 */
      min-width: 0;     /* 允许收缩到任意小 */
      max-width: 150px;
      text-align: center;
      background: var(--palette-3);
      border-radius: 10px 10px 0 0;
      overflow: hidden;
    }
    .timer .box:nth-child(2) .value { animation-delay: 1s; }
    .timer .box:nth-child(3) .value { animation-delay: 1.8s; }
    .timer .box:nth-child(4) .value { animation-delay: 1.3s; }
    .timer .box:nth-child(5) .value { animation-delay: 2s; }
    .timer .box .spacer {
      position: relative;
      display: block;
      height: 20px;
      background: var(--palette-2);
    }
    .timer .box .spacer::before, .timer .box .spacer::after {
      content: '';
      position: absolute;
      top: 5px;
      width: 10px;
      height: 10px;
      background: var(--palette-1);
      border-radius: 50%;
    }
    .timer .box .spacer::before { left: 0.8rem; }
    .timer .box .spacer::after { right: 0.8rem; }
    .timer .box .value {
      position: relative;
      margin: 0;
      padding: 1.2rem 0 2rem;
      font-family: "Arial Black", "Raleway", "PingFang SC", sans-serif;
      font-size: clamp(1.7em, 5vw, 3em);
      white-space: nowrap;
      color: rgba(109, 104, 117, 0.6);
      background: var(--palette-2);
      transform-origin: top center;
      animation: wind 4s ease-out alternate infinite;
    }
    .timer .box .label {
      margin: 0;
      padding: 1rem;
      color: rgba(255, 255, 255, 0.85);
      background: var(--palette-3);
      font-size: clamp(0.75em, 2vw, 1em);
    }
    .timer .box .label::first-letter { text-transform: uppercase; }
    .text {
      margin-top: 2rem;
      font-weight: 300;
      font-size: clamp(1em, 3.5vw, 1.25em);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-align: center;
      color: var(--palette-4);
    }

    /* ============ 动画 ============ */
    @keyframes wind {
      0% {
        transform: rotatex(0);
        box-shadow: 0 15px 10px -10px rgba(181, 131, 141, 0);
        color: rgba(109, 104, 117, 0.6);
        background: var(--palette-2);
      }
      10% {
        transform: rotatex(20deg);
        box-shadow: 0 15px 10px -10px #a67882;
        color: rgba(109, 104, 117, 0.45);
        background: #ffbeb0;
      }
    }
    @keyframes lighting {
      0% { box-shadow: -16px 0 0 2px rgba(255,255,255,.5), 14px 0 0 var(--palette-3); }
      4% { box-shadow: -16px 0 0 2px rgba(255,255,255,1), 14px 0 0 var(--palette-3); }
      8% { box-shadow: -16px 0 0 2px rgba(255,255,255,.5), 14px 0 0 var(--palette-3); }
      12% { box-shadow: -16px 0 0 2px rgba(255,255,255,1), 14px 0 0 var(--palette-3); }
      20% { box-shadow: -16px 0 0 2px rgba(255,255,255,1), 14px 0 0 var(--palette-3); }
      22% { box-shadow: -16px 0 0 2px rgba(255,255,255,.5), 14px 0 0 var(--palette-3); }
    }
    @keyframes lighting2 {
      0% { box-shadow: 16px 0 0 2px rgba(255,255,255,.5), -14px 0 0 var(--palette-3); }
      4% { box-shadow: 16px 0 0 2px rgba(255,255,255,1), -14px 0 0 var(--palette-3); }
      8% { box-shadow: 16px 0 0 2px rgba(255,255,255,.5), -14px 0 0 var(--palette-3); }
      12% { box-shadow: 16px 0 0 2px rgba(255,255,255,1), -14px 0 0 var(--palette-3); }
      20% { box-shadow: 16px 0 0 2px rgba(255,255,255,1), -14px 0 0 var(--palette-3); }
      22% { box-shadow: 16px 0 0 2px rgba(255,255,255,.5), -14px 0 0 var(--palette-3); }
    }

    /* ============ 手机竖屏微调 ============ */
    @media (max-width: 480px) {
      .page { padding: 12px; }
      .glass-card { width: 94vw; border-radius: 18px; padding: 18px 10px; }
      .bus { transform: scale(0.62); margin-bottom: 2.4rem; }
      .timer { gap: 6px; }
      .timer .box .spacer { height: 14px; }
      .timer .box .spacer::before, .timer .box .spacer::after {
        width: 7px;
        height: 7px;
        top: 3.5px;
      }
      .timer .box .spacer::before { left: 0.5rem; }
      .timer .box .spacer::after { right: 0.5rem; }
      .timer .box .value { font-size: clamp(1.3em, 6.5vw, 2.2em); padding: 0.8rem 0 1.2rem; }
      .timer .box .label { padding: 0.6rem 0.2rem; font-size: clamp(0.6em, 2.4vw, 0.8em); letter-spacing: 0.5px; }
      .timer .text { letter-spacing: 2px; margin-top: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- 樱花动画背景 -->
  <canvas id="sakura"></canvas>

  <!-- 透明玻璃卡片：公交车 + 从过去计时到现在 -->
  <div class="page">
    <div class="glass-card">
      <div class="bus">
        <div class="windows"></div>
        <div class="lights"></div>
        <div class="street"></div>
      </div>
      <section class="countdown">
        <div class="timer">
          <div class="box">
            <div class="spacer"></div>
            <p class="value" id="d">00</p>
            <p class="label">days</p>
          </div>
          <div class="box">
            <div class="spacer"></div>
            <p class="value" id="h">00</p>
            <p class="label">hours</p>
          </div>
          <div class="box">
            <div class="spacer"></div>
            <p class="value" id="m">00</p>
            <p class="label">minutes</p>
          </div>
          <div class="box">
            <div class="spacer"></div>
            <p class="value" id="s">00</p>
            <p class="label">seconds</p>
          </div>
        </div>
        <p class="text">文文 佳佳</p>
      </section>
    </div>
  </div>

  <!-- 樱花 WebGL 着色器 -->
  <script id="sakura_point_vsh" type="x-shader/x_vertex">
uniform mat4 uProjection;
uniform mat4 uModelview;
uniform vec3 uResolution;
uniform vec3 uOffset;
uniform vec3 uDOF;  //x:focus distance, y:focus radius, z:max radius
uniform vec3 uFade; //x:start distance, y:half distance, z:near fade start

attribute vec3 aPosition;
attribute vec3 aEuler;
attribute vec2 aMisc; //x:size, y:fade

varying vec3 pposition;
varying float psize;
varying float palpha;
varying float pdist;

//varying mat3 rotMat;
varying vec3 normX;
varying vec3 normY;
varying vec3 normZ;
varying vec3 normal;

varying float diffuse;
varying float specular;
varying float rstop;
varying float distancefade;

void main(void) {
    // Projection is based on vertical angle
    vec4 pos = uModelview * vec4(aPosition + uOffset, 1.0);
    gl_Position = uProjection * pos;
    gl_PointSize = aMisc.x * uProjection[1][1] / -pos.z * uResolution.y * 0.5;

    pposition = pos.xyz;
    psize = aMisc.x;
    pdist = length(pos.xyz);
    palpha = smoothstep(0.0, 1.0, (pdist - 0.1) / uFade.z);

    vec3 elrsn = sin(aEuler);
    vec3 elrcs = cos(aEuler);
    mat3 rotx = mat3(
        1.0, 0.0, 0.0,
        0.0, elrcs.x, elrsn.x,
        0.0, -elrsn.x, elrcs.x
    );
    mat3 roty = mat3(
        elrcs.y, 0.0, -elrsn.y,
        0.0, 1.0, 0.0,
        elrsn.y, 0.0, elrcs.y
    );
    mat3 rotz = mat3(
        elrcs.z, elrsn.z, 0.0,
        -elrsn.z, elrcs.z, 0.0,
        0.0, 0.0, 1.0
    );
    mat3 rotmat = rotx * roty * rotz;
    normal = rotmat[2];

    mat3 trrotm = mat3(
        rotmat[0][0], rotmat[1][0], rotmat[2][0],
        rotmat[0][1], rotmat[1][1], rotmat[2][1],
        rotmat[0][2], rotmat[1][2], rotmat[2][2]
    );
    normX = trrotm[0];
    normY = trrotm[1];
    normZ = trrotm[2];

    const vec3 lit = vec3(0.6917144638660746, 0.6917144638660746, -0.20751433915982237);

    float tmpdfs = dot(lit, normal);
    if(tmpdfs < 0.0) {
        normal = -normal;
        tmpdfs = dot(lit, normal);
    }
    diffuse = 0.4 + tmpdfs;

    vec3 eyev = normalize(-pos.xyz);
    if(dot(eyev, normal) > 0.0) {
        vec3 hv = normalize(eyev + lit);
        specular = pow(max(dot(hv, normal), 0.0), 20.0);
    }
    else {
        specular = 0.0;
    }

    rstop = clamp((abs(pdist - uDOF.x) - uDOF.y) / uDOF.z, 0.0, 1.0);
    rstop = pow(rstop, 0.5);
    //-0.69315 = ln(0.5)
    distancefade = min(1.0, exp((uFade.x - pdist) * 0.69315 / uFade.y));
}
  </script>
  <script id="sakura_point_fsh" type="x-shader/x_fragment">
#ifdef GL_ES
//precision mediump float;
precision highp float;
#endif

uniform vec3 uDOF;  //x:focus distance, y:focus radius, z:max radius
uniform vec3 uFade; //x:start distance, y:half distance, z:near fade start

const vec3 fadeCol = vec3(0.08, 0.03, 0.06);

varying vec3 pposition;
varying float psize;
varying float palpha;
varying float pdist;

//varying mat3 rotMat;
varying vec3 normX;
varying vec3 normY;
varying vec3 normZ;
varying vec3 normal;

varying float diffuse;
varying float specular;
varying float rstop;
varying float distancefade;

float ellipse(vec2 p, vec2 o, vec2 r) {
    vec2 lp = (p - o) / r;
    return length(lp) - 1.0;
}

void main(void) {
    vec3 p = vec3(gl_PointCoord - vec2(0.5, 0.5), 0.0) * 2.0;
    vec3 d = vec3(0.0, 0.0, -1.0);
    float nd = normZ.z; //dot(-normZ, d);
    if(abs(nd) < 0.0001) discard;

    float np = dot(normZ, p);
    vec3 tp = p + d * np / nd;
    vec2 coord = vec2(dot(normX, tp), dot(normY, tp));

    //angle = 15 degree
    const float flwrsn = 0.258819045102521;
    const float flwrcs = 0.965925826289068;
    mat2 flwrm = mat2(flwrcs, -flwrsn, flwrsn, flwrcs);
    vec2 flwrp = vec2(abs(coord.x), coord.y) * flwrm;

    float r;
    if(flwrp.x < 0.0) {
        r = ellipse(flwrp, vec2(0.065, 0.024) * 0.5, vec2(0.36, 0.96) * 0.5);
    }
    else {
        r = ellipse(flwrp, vec2(0.065, 0.024) * 0.5, vec2(0.58, 0.96) * 0.5);
    }

    if(r > rstop) discard;

    vec3 col = mix(vec3(1.0, 0.8, 0.75), vec3(1.0, 0.9, 0.87), r);
    float grady = mix(0.0, 1.0, pow(coord.y * 0.5 + 0.5, 0.35));
    col *= vec3(1.0, grady, grady);
    col *= mix(0.8, 1.0, pow(abs(coord.x), 0.3));
    col = col * diffuse + specular;

    col = mix(fadeCol, col, distancefade);

    float alpha = (rstop > 0.001)? (0.5 - r / (rstop * 2.0)) : 1.0;
    alpha = smoothstep(0.0, 1.0, alpha) * palpha;

    gl_FragColor = vec4(col * 0.5, alpha);
}
  </script>
  <script id="fx_common_vsh" type="x-shader/x_vertex">
uniform vec3 uResolution;
attribute vec2 aPosition;

varying vec2 texCoord;
varying vec2 screenCoord;

void main(void) {
    gl_Position = vec4(aPosition, 0.0, 1.0);
    texCoord = aPosition.xy * 0.5 + vec2(0.5, 0.5);
    screenCoord = aPosition.xy * vec2(uResolution.z, 1.0);
}
  </script>
  <script id="bg_fsh" type="x-shader/x_fragment">
#ifdef GL_ES
//precision mediump float;
precision highp float;
#endif

uniform vec2 uTimes;

varying vec2 texCoord;
varying vec2 screenCoord;

void main(void) {
    vec3 col;
    float c;
    vec2 tmpv = texCoord * vec2(0.8, 1.0) - vec2(0.95, 1.0);
    c = exp(-pow(length(tmpv) * 1.8, 2.0));
    col = mix(vec3(0.02, 0.0, 0.03), vec3(0.96, 0.98, 1.0) * 1.5, c);
    gl_FragColor = vec4(col * 0.5, 1.0);
}
  </script>
  <script id="fx_brightbuf_fsh" type="x-shader/x_fragment">
#ifdef GL_ES
//precision mediump float;
precision highp float;
#endif
uniform sampler2D uSrc;
uniform vec2 uDelta;

varying vec2 texCoord;
varying vec2 screenCoord;

void main(void) {
    vec4 col = texture2D(uSrc, texCoord);
    gl_FragColor = vec4(col.rgb * 2.0 - vec3(0.5), 1.0);
}
  </script>
  <script id="fx_dirblur_r4_fsh" type="x-shader/x_fragment">
#ifdef GL_ES
//precision mediump float;
precision highp float;
#endif
uniform sampler2D uSrc;
uniform vec2 uDelta;
uniform vec4 uBlurDir; //dir(x, y), stride(z, w)

varying vec2 texCoord;
varying vec2 screenCoord;

void main(void) {
    vec4 col = texture2D(uSrc, texCoord);
    col = col + texture2D(uSrc, texCoord + uBlurDir.xy * uDelta);
    col = col + texture2D(uSrc, texCoord - uBlurDir.xy * uDelta);
    col = col + texture2D(uSrc, texCoord + (uBlurDir.xy + uBlurDir.zw) * uDelta);
    col = col + texture2D(uSrc, texCoord - (uBlurDir.xy + uBlurDir.zw) * uDelta);
    gl_FragColor = col / 5.0;
}
  </script>
  <!-- effect fragment shader template -->
  <script id="fx_common_fsh" type="x-shader/x_fragment">
#ifdef GL_ES
//precision mediump float;
precision highp float;
#endif
uniform sampler2D uSrc;
uniform vec2 uDelta;

varying vec2 texCoord;
varying vec2 screenCoord;

void main(void) {
    gl_FragColor = texture2D(uSrc, texCoord);
}
  </script>
  <!-- post processing -->
  <script id="pp_final_vsh" type="x-shader/x_vertex">
uniform vec3 uResolution;
attribute vec2 aPosition;
varying vec2 texCoord;
varying vec2 screenCoord;
void main(void) {
    gl_Position = vec4(aPosition, 0.0, 1.0);
    texCoord = aPosition.xy * 0.5 + vec2(0.5, 0.5);
    screenCoord = aPosition.xy * vec2(uResolution.z, 1.0);
}
  </script>
  <script id="pp_final_fsh" type="x-shader/x_fragment">
#ifdef GL_ES
//precision mediump float;
precision highp float;
#endif
uniform sampler2D uSrc;
uniform sampler2D uBloom;
uniform vec2 uDelta;
varying vec2 texCoord;
varying vec2 screenCoord;
void main(void) {
    vec4 srccol = texture2D(uSrc, texCoord) * 2.0;
    vec4 bloomcol = texture2D(uBloom, texCoord);
    vec4 col;
    col = srccol + bloomcol * (vec4(1.0) + srccol);
    col *= smoothstep(1.0, 0.0, pow(length((texCoord - vec2(0.5)) * 2.0), 1.2) * 0.5);
    col = pow(col, vec4(0.45454545454545)); //(1.0 / 2.2)

    gl_FragColor = vec4(col.rgb, 1.0);
    gl_FragColor.a = 1.0;
}
  </script>

  <!-- 樱花动画主体 -->
  <script src="daojishi/js/script.js"></script>

  <!-- 倒计时逻辑：从 2026-07-02 21:14 起累计到现在 -->
  <script>
    // ★ 修改这里即可：起点时间（年, 月-1, 日, 时, 分, 秒）——注意月份从 0 开始，7月要写 6
    var startDate = new Date(2026, 6, 2, 21, 14, 0);

    function pad2(n) { return (n < 10) ? '0' + n : '' + n; }

    function updateTime() {
      var diff = new Date() - startDate; // 毫秒差（从起点到现在）
      if (diff < 0) diff = 0; // 当前时间早于起点时显示 00

      var days = Math.floor(diff / (1000 * 60 * 60 * 24));
      var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('d').textContent = pad2(days);
      document.getElementById('h').textContent = pad2(hours);
      document.getElementById('m').textContent = pad2(minutes);
      document.getElementById('s').textContent = pad2(seconds);
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
