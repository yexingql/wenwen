	<style type="text/css">
		* {
			margin: 0;
			padding: 0;
		}

		HTML,
		body,
		div,
		h1,
		h2,
		h3,
		h4,
		h5,
		h6,
		ul,
		ol,
		dl,
		li,
		dt,
		dd,
		p,
		blockquote,
		pre,
		form,
		fieldset,
		table,
		th,

			border: none;
			font-family: "微软雅黑", "黑体", "宋体";
			font-size: 14px;
			margin: 0px;
			padding: 0px;
		}

		html,
		body {
			height: 100%;
			width: 100%;
			overflow-x: hidden;
		}

		address,
		caption,
		cite,
		code,
		dfn,
		em,
		strong,
		th,
		var {
			font-style: normal;
			font-weight: normal;
		}

		a {
			text-decoration: none;
		}

		a:link {
			color: #fff;
		}

		a:visited {
			color: #fff;
		}

		a:hover {
			color: #fff;
		}

		a:active {
			color: #fff;
		}

		input::-ms-clear {
			display: none;
		}

		input::-ms-reveal {
			display: none;
		}

		input {
			-webkit-appearance: none;
			margin: 0;
			outline: none;
			padding: 0;
		}

		input::-webkit-input-placeholder {
			color: #ccc;
		}

		input::-ms-input-placeholder {
			color: #ccc;
		}

		input::-moz-placeholder {
			color: #ccc;
		}

		input[type=submit],
		input[type=button] {
			cursor: pointer;
		}

		button[disabled],
		input[disabled] {
			cursor: default;
		}

		img {
			border: none;
		}

		ul,
		ol,
		li {
			list-style-type: none;
		}

		/*公共方法*/
		.clear {
			clear: both;
		}

		.clearleft {
			clear: left;
		}

		.clearright {
			clear: right;
		}

		.floatleft {
			float: left;
		}

		.floatright {
			float: right;
		}

		.cursor {
			cursor: pointer;
		}

		/*背景及色值表*/
		.bg000 {
			background: #000;
		}

		.color000 {
			color: #000;
		}

		body {
			background-image: linear-gradient(to left, rgba(255, 0, 149, 0.2), rgba(0, 247, 255, 0.2)), url(#);
			/*background: #81a779;*/
			background-repeat: no-repeat;
			background-attachment: fixed;
			background-size: cover;
		}

		#box {
			width: 100%;
			min-height: calc(100% - 160px);
			margin: 0 auto;
			padding-top: 90px;
		}

		#footer {
			width: 100%;
			height: 50px;
			color: #000;
			text-align: center;
			font-size: 16px;
		}

		#footer a {

		}

		#boox {

			margin: 0 auto;

	<style>
		#sakura-toggle {
			margin: 0;
			padding: 5px;
			border-radius: 50%;
			border: 1px solid rgba(255,255,255,.6);
			background: rgba(255,255,255,.35);
			-webkit-backdrop-filter: blur(10px);
			backdrop-filter: blur(10px);
			cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12);
			transition: all .25s;
		}
		#sakura-toggle svg { width: 26px; height: 26px; display: block; }
		#sakura-toggle svg path { fill: #ffb3c8; stroke: #ffb3c8; transition: all .4s; }
		#sakura-toggle:hover { transform: translateY(-1px) scale(1.05); }
		#sakura-toggle.off { opacity: .5; }
		#sakura-toggle.off svg path { fill: #8f8f9f; stroke: #8f8f9f; }
		.card-btns {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 12px;
			margin: 12px auto 22px;
		}
		#sakura-toggle { margin: 0; }
		.bulb-btn {
			width: 38px; height: 38px; padding: 5px;
			border-radius: 50%; border: 1px solid rgba(255,255,255,.6);
			background: rgba(255,255,255,.35);
			-webkit-backdrop-filter: blur(10px);
			backdrop-filter: blur(10px);
			cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12);
			transition: all .25s;
		}
		.bulb-btn:hover { transform: translateY(-1px) scale(1.05); }
		.bulb-btn svg { width: 26px; height: 26px; display: block; }
		.bulb-btn #s-bulb { fill: #c4d8d9; stroke: #c4d8d9; stroke-width: 0; transition: all .4s; }
		.bulb-btn #www-filament { fill: #ffdf43; stroke: #ffdf43; stroke-width: 0; transition: all .4s; }
		body.dark-mode .bulb-btn #s-bulb { fill: #262832; stroke: #262832; }
		body.dark-mode .bulb-btn #www-filament { fill: #333542; stroke: #333542; }
		/* 暗色主题 */
		body.dark-mode {
			background-image: linear-gradient(to left, rgba(8,10,22,.94), rgba(4,6,14,.97)), url(#);
		}
		body.dark-mode #boox {
			background: rgba(16,20,36,.62);
			border-color: rgba(255,255,255,.16);
			box-shadow: 0 8px 32px rgba(0,0,0,.5);
		}
		body.dark-mode .title { color: #f2f2f2; border-color: #ffb3c8; }
		body.dark-mode .lizhi { color: #c9c9c9; }
		body.dark-mode .bulb-btn { background: rgba(24,28,46,.55); border-color: rgba(255,255,255,.22); }
		body.dark-mode #sakura-toggle.off svg path { fill: #6f6f7f; stroke: #6f6f7f; }
		body.dark-mode #certify .swiper-slide { background: #1a1e30; box-shadow: 0 8px 30px rgba(0,0,0,.55); }
		body.dark-mode #certify .swiper-slide p { color: #b8b8c8; }
		body.dark-mode #footer, body.dark-mode #footer a { color: #c9c9c9; }
		/* 三卡片展开墙（美食/旅游/光遇） */
		.artboard {
			width: 92%;
			margin: 26px auto 0;
		}
		.artboard .cards {
			display: flex;
			height: 340px;
			border-radius: 16px;
			overflow: hidden;
			box-shadow: 0 8px 30px rgba(0,0,0,.18);
		}
		.artboard .card {
			width: 33.333%;
			min-width: 33.333%;
			flex: 0 1 33.333%;
			position: relative;
			cursor: pointer;
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			transition: width .5s cubic-bezier(.7,0,.2,1), flex-basis .5s cubic-bezier(.7,0,.2,1), min-width .5s cubic-bezier(.7,0,.2,1), opacity .35s;
		}
		.artboard .card a {
			position: absolute;
			left: 0; right: 0; top: 50%;
			transform: translateY(-50%);
			text-align: center;
			font-family: "微软雅黑", "PingFang SC", sans-serif;
			font-size: 42px; font-weight: bold;
			color: #fff; text-decoration: none;
			text-shadow: 0 2px 12px rgba(0,0,0,.55);
			letter-spacing: .12em;
			transition: all .35s;
			pointer-events: none;
		}
		.artboard .card.open { width: 100% !important; min-width: 100% !important; flex-basis: 100% !important; }
		.artboard .card.open a { font-size: 52px; }
		.artboard .card.close { width: 2% !important; min-width: 2% !important; flex-basis: 2% !important; }
		.artboard .card.close a { opacity: 0; }
		.artboard .p-food { background-image: url("photo/image/card-food.jpg"); }
		.artboard .p-travel { background-image: url("photo/image/card-travel.jpg"); }
		.artboard .p-sky { background-image: url("photo/image/card-sky.jpg"); }
		@media screen and (max-width: 699px) {
			.artboard { width: 94%; }
			.artboard .cards { height: 300px; }
			.artboard .card a { font-size: 30px; }
			.artboard .card.open a { font-size: 36px; }
		}
		/* TornPaper 撕裂纸照片墙 */
		#gallery {
			--size: 200px;
			--gap: 10px;
			position: relative;
			box-sizing: border-box;
			width: min(100%, 1000px);
			margin: 30px auto 0;
			display: none;
			grid-template-columns: repeat(auto-fit, minmax(var(--size), 1fr));
			gap: var(--gap);
			padding: var(--gap);
			overflow: hidden;
			filter: drop-shadow(0.3rem 0.3rem 0.3rem rgba(0, 0, 0, 0.5));
		}
		#gallery.active { display: grid; }
		@media screen and (max-width: 700px) {
			#gallery { --size: 170px; width: 94%; grid-template-columns: repeat(2, 1fr); }
		}
		.tp-card {
			box-sizing: border-box;
			--pin-x: 50%;
			--pin-y: 0.5rem;
			--pin-angle: 10deg;
			--pin-color: crimson;
			position: relative;
			width: 100%;
			aspect-ratio: 1/1.25;
			padding: 0.75rem;
			display: grid;
			place-items: center;
			background-color: papayawhip;
			background-image: var(--img);
			background-position: center;
			background-size: cover;
			filter: url(#filter_tornpaper);
			transform-origin: var(--pin-x) var(--pin-y);
			transform: translateZ(0) rotate3d(0, 0, 1, var(--pin-angle));
			isolation: isolate;
		}
		.tp-card:after {
			position: absolute;
			top: var(--pin-y);
			left: var(--pin-x);
			width: 0.7rem;
			height: 0.7rem;
			content: "";
			background: var(--pin-color);
			border-radius: 50%;
			box-shadow: -0.1rem -0.1rem 0.3rem 0.02rem rgba(0, 0, 0, 0.5) inset;
			filter: drop-shadow(0.3rem 0.15rem 0.2rem rgba(0, 0, 0, 0.5));
		}
		.tp-card h2 {
			position: absolute;
			bottom: 1rem;
			left: 0;
			right: 0;
			margin: 0 0.5rem;
			font-size: 1.1rem;
			color: #fff;
			text-shadow: 0 1px 6px rgba(0, 0, 0, .65);
		}
		#gallery .tp-card:nth-child(6n+1) { --pin-color: gold; --pin-angle: -2deg; }
		#gallery .tp-card:nth-child(6n+2) { --pin-color: crimson; --pin-angle: 3deg; }
		#gallery .tp-card:nth-child(6n+3) { --pin-color: skyblue; --pin-angle: -3deg; }
		#gallery .tp-card:nth-child(6n+4) { --pin-color: deeppink; --pin-angle: -5deg; }
		#gallery .tp-card:nth-child(6n+5) { --pin-color: orchid; --pin-angle: 2deg; }
		#gallery .tp-card:nth-child(6n+6) { --pin-color: springgreen; --pin-angle: 5deg; }
	</style>

			<script>
				var certifySwiper = new Swiper('#certify .swiper-container', {
					watchSlidesProgress: true,
					slidesPerView: 'auto',
					centeredSlides: true,
					loop: true,
					loopedSlides: 5,
					autoplay: {
						delay: 3000,
						disableOnInteraction: false
					},
					touchStartPreventDefault: false,
					touchMoveStopPropagation: true,
					simulateTouch: true,
					grabCursor: true,
					preventClicks: false,
					speed: 400,
					navigation: {
						nextEl: '.swiper-button-next',
						prevEl: '.swiper-button-prev',
					},
					pagination: {
						el: '.swiper-pagination',
						//clickable :true,
					},
					on: {
						progress: function(progress) {
							for (i = 0; i < this.slides.length; i++) {
								var slide = this.slides.eq(i);
								var slideProgress = this.slides[i].progress;
								modify = 1;
								if (Math.abs(slideProgress) > 1) {
									modify = (Math.abs(slideProgress) - 1) * 0.3 + 1;
								}
								translate = slideProgress * modify * 260 + 'px';
								scale = 1 - Math.abs(slideProgress) / 5;
								zIndex = 999 - Math.abs(Math.round(10 * slideProgress));
								slide.transform('translateX(' + translate + ') scale(' + scale + ')');
								slide.css('zIndex', zIndex);
								slide.css('opacity', 1);
								if (Math.abs(slideProgress) > 3) {
									slide.css('opacity', 0);
								}
							}
						},
						setTransition: function(transition) {
							for (var i = 0; i < this.slides.length; i++) {
								var slide = this.slides.eq(i)
								slide.transition(transition);
							}

						}
					}

				})

		<script>
			(function () {
				var cards = document.querySelectorAll('.artboard .card');
				var galleryBox = document.getElementById('gallery');
				if (!cards.length || !galleryBox) return;
				function showGroup(group) {
					galleryBox.querySelectorAll('.tp-card').forEach(function (c) {
						c.style.display = (c.getAttribute('data-group') === group) ? '' : 'none';
					});
					galleryBox.classList.add('active');
					galleryBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
				}
				function hideGallery() {
					galleryBox.classList.remove('active');
				}
				cards.forEach(function (card) {
					card.addEventListener('click', function () {
						var alreadyOpen = card.classList.contains('open');
						cards.forEach(function (c) { c.classList.remove('open', 'close'); });
						if (!alreadyOpen) {
							card.classList.add('open');
							cards.forEach(function (c) { if (c !== card) c.classList.add('close'); });
							var group = card.classList.contains('p-food') ? 'food' :
								(card.classList.contains('p-travel') ? 'travel' : 'sky');
							showGroup(group);
						} else {
							hideGallery();
						}
					});
				});
			})();
		</script>
